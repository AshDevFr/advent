# Builds the public demo (the template's sample days, every door open) and
# deploys it to Cloudflare Pages on every push to main.
#
# Needs the secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project is created on first deploy.

name: Demo

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo
  cancel-in-progress: true

env:
  PAGES_PROJECT: advent-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the demo
        run: make demo

      - name: Create the Pages project if missing
        run: |
          # Exact name match: "advent-demo" must not match "advent-demo-2".
          npx --yes wrangler@4 pages project list | grep -qE "(^|[^a-z0-9-])${PAGES_PROJECT}([^a-z0-9-]|$)" \
            || npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy demo-dist --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Builds everything published at advent-engine.4sh.dev and deploys it in one
# Cloudflare Pages upload: the documentation at the root, the public demo
# under /demo/ and the showcases under /northwind/ and /christmas/. The
# docs' screenshots are captured from this build, so they always match.
#
# Needs the secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project is created on first deploy.

name: Site

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

env:
  PAGES_PROJECT: advent-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Install the docs dependencies and Chromium for the screenshots
        run: |
          make docs/node_modules
          cd docs && npx playwright install --with-deps chromium

      - name: Build the docs, the demo, the showcases and the screenshots
        run: make screenshots

      - name: Create the Pages project if missing
        run: |
          # Exact name match: "advent-demo" must not match "advent-demo-2".
          npx --yes wrangler@4 pages project list | grep -qE "(^|[^a-z0-9-])${PAGES_PROJECT}([^a-z0-9-]|$)" \
            || npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

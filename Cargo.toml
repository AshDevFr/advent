[workspace]
members = ["crates/core", "crates/server", "crates/cli"]
resolver = "2"
default-members = ["crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sylvain Cau <sylvain.cau@gmail.com>"]
description = "Engine for puzzle advent calendars"
# cargo-dist derives artifact URLs from this field.
repository = "https://github.com/AshDevFr/advent"

[workspace.dependencies]
advent-core = { path = "crates/core" }
advent-server = { path = "crates/server" }

# advent-core must stay free of tokio and filesystem access so it builds for
# wasm32-unknown-unknown; keep runtime-only crates out of its dependency list.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["yaml", "env"] }

# PBKDF2 runs 150 000 to 200 000 rounds per call; unoptimized, that makes
# every seal and test take seconds. Optimize only the hashing crates in dev.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

# The single sign-on tests generate an RSA key, which takes many seconds
# unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The profile `dist build` compiles release binaries with.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
# Keep in step with the installed `dist` and .github/workflows/release.yml
# (regenerate that file with `dist generate` after changing anything here).
cargo-dist-version = "0.30.3"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# The binary embeds web/dist, so the frontend must be built before cargo.
github-build-setup = "../build-setup.yml"
pr-run-mode = "plan"
install-updater = false
install-path = "CARGO_HOME"

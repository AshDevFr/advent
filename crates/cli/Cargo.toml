[package]
name = "advent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "advent"
path = "src/main.rs"

[dependencies]
advent-core.workspace = true
anyhow.workspace = true
clap.workspace = true
figment.workspace = true
serde.workspace = true
chrono = "0.4"
include_dir = "0.7"
serde_json.workspace = true
getrandom = "0.4"
tar = "0.4"
# Pure-Rust codecs only (lossless WebP output, no libwebp), so cross-compiling
# the binary needs no C toolchain.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"
ctrlc = "3"
advent-server.workspace = true
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
rusqlite = { version = "0.41.1", features = ["bundled", "chrono"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_yaml = "0.9"
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
figment = { workspace = true, features = ["test"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "cookies"] }

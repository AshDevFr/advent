[package]
name = "advent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Normalization, sealing and release logic for advent; builds for wasm32"
repository.workspace = true

[dependencies]
unicode-normalization = "0.1"
# No getrandom: callers pass IVs in, and getrandom does not build for wasm32-unknown-unknown.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = "0.13"
sha2 = "0.11"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
age = { version = "0.12", default-features = false }
# Same YAML crate figment uses in the CLI, so the workspace carries one parser.
serde_yaml = "0.9"
# No default features: chrono's clock reads system time, which core never
# does (callers pass `now` in) and which does not exist on wasm32-unknown-unknown.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }

# age draws randomness through getrandom 0.2, which only builds for
# wasm32-unknown-unknown with its browser (js) backend enabled.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

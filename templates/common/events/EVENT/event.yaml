title: "Advent {{event}}"
# Days open at 00:00 in this timezone (an IANA name such as Europe/Paris).
timezone: UTC
start: "{{start}}"
days: 24
# By default days are consecutive from `start`. To spread them out, either:
#   every: 2           # a door every 2 days (Dec 1, 3, 5, ...)
#   weekdays: true     # Monday to Friday only (combine with every: N)
# or list each day's date (as many as `days`, starting with `start`):
#   dates: [2026-12-01, 2026-12-03, 2026-12-08]
# `advent schedule` prints the result.

# Announcements at the top of the calendar. A notice with `day` appears when
# that day opens, one with `date` from that date, others from the start.
# Players can dismiss each one; editing its text shows it again.
# notices:
#   - text: "Hints arrive at midnight."
#   - text: "Day 12's puzzle had a typo; it is fixed now."
#     day: 12

# When hints appear, in days after a door opens (at local midnight; 0 means
# with the door). A hint in meta.yaml can set its own: {text: ..., after: 0}.
hint_after: [1, 2]
story:
  # Optional display headline; the title above is used when absent.
  # title: "The Longest Night Hunt"
  intro: "One door a day. Each solve gives you one word of the key. Collect them all and the key opens your certificate."

# Company edition: build the calendar image (engine + sealed files) and push it
# to this repository's GitHub container registry. Runs on demand; to rebuild on
# every push to main, add `push: { branches: [main] }` under `on`.
name: Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine version
        id: engine
        run: |
          version=$(grep '^engine:' advent.yaml | tr -d '" ' | cut -d: -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ENGINE=${{ steps.engine.outputs.version }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

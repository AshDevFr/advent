# Who runs this calendar. Shared by every event in the repo; an event's
# theme.yaml can restyle colours but never change the name or logo.
name: Advent Calendar
logo: logo.svg

# Colours for each scheme. The site follows the player's system setting, and
# players can switch between light and dark, so both palettes are used.
# Keys: primary, on-primary, surface, surface-raised, text, text-muted,
# accent, border. A key left out keeps the engine default for that scheme.
palette:
  light:
    primary: "#a8621a"
    surface: "#f6f3ec"
    text: "#1b1d24"
  dark:
    primary: "#e3a54f"
    surface: "#10131a"
    text: "#e9ecf3"

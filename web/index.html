<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- advent build sets the site's base path here (default "/"). -->
    <base href="/" />
    <title>Advent calendar</title>
    <script>
      // Apply a saved light/dark choice before first paint, so the page
      // never flashes the other scheme. "system" (the default) sets nothing.
      try {
        const theme = localStorage.getItem("advent-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
